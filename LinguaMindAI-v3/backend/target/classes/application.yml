spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linguamind}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${PORT:8080}
linguamind:
  ai:
    provider: ${AI_PROVIDER:anthropic}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-4-6}
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION}
